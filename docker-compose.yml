services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: citas_medicas
      POSTGRES_USER: citas
      POSTGRES_PASSWORD: citas_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citas -d citas_medicas"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "3002:3002"
    environment:
      SERVICE_NAME: api
      PORT: 3002
      DATABASE_URL: postgresql://citas:citas_dev_pass@postgres:5432/citas_medicas
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super-secret-key-change-in-production
      JWT_REFRESH_SECRET: super-secret-refresh-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      SERVICE_NAME: web
      NEXT_PUBLIC_API_URL: http://localhost:3002/api
    depends_on:
      - api

  admin:
    build: .
    ports:
      - "3001:3001"
    environment:
      SERVICE_NAME: admin
      NEXT_PUBLIC_API_URL: http://localhost:3002/api
    depends_on:
      - api

volumes:
  pgdata:
